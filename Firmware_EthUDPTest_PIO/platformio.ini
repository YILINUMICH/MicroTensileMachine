; Firmware_EthUDPTest_PIO — Step 1 of the UDP migration (see
; docs/UDP_stream_migration_plan.md). Minimal, ISOLATED connectivity proof:
; brings up the Portenta H7 Ethernet with a static IP and broadcasts a 1 Hz UDP
; heartbeat to the PC, printing endPacket() duration over USB serial to prove
; the UDP send is NON-BLOCKING (the whole premise of moving the stream to UDP).
;
; This does NOT touch the production firmware. Flash it to the M7, verify the PC
; receives the heartbeat (udp_listen.py) and that endPacket_us stays small, then
; flash Firmware_SMASensorHub_PIO back.
;
;   pio run -d Firmware_EthUDPTest_PIO -e portenta_m7 -t upload
;   python Firmware_EthUDPTest_PIO/udp_listen.py        ; on the PC
;
; COM8 = Portenta H7 (pinned so PIO doesn't grab the Zaber on COM5).

[env:portenta_m7]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
upload_port     = COM8
monitor_port    = COM8
build_flags =
    -Wall
    -Wextra
