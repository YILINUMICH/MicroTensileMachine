; ADS1263 self-calibration verification — Phase 2.1
;
; M7-only, single-environment sketch. Same hardware target as
; ADS1263_FirstPowerUp_PIO/. Assumes Phase 1 has been bench-verified
; (cp0–cp10 in FirstPowerUp + Phase 1.2 NoiseFloor).
;
; What this sketch does:
;   1. Bring up the chip (compressed version of FirstPowerUp cp0–cp4
;      + cp6 VBIAS).
;   2. Phase 2.1.A — SFOCAL1 self-offset calibration sweep across PGA
;      gains {1, 2, 4, 8, 16, 32}. For each gain: measure pre-cal
;      offset, run SFOCAL1, verify OFCAL register was written, verify
;      INTERFACE register didn't snap back (per integration notes §6),
;      verify post-cal offset is dramatically smaller.
;   3. Phase 2.1.B — SYGCAL1 system-gain calibration demo. Drive TDAC
;      at 0.8·AVDD (≈ 4.16 V differential, ~83 % of full-scale at
;      PGA=1, VREF=5 V), run SYGCAL1, verify FSCAL register was
;      written and post-cal measurement closer to the predicted
;      ratiometric value.
;
; Flash with:   pio run -t upload
; Monitor with: pio device monitor   (115200 baud)

[env:portenta_m7_selfcal]
platform = ststm32
board = portenta_h7_m7
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_PORTENTA_H7_M7
    -DCORE_CM7
upload_protocol = dfu
