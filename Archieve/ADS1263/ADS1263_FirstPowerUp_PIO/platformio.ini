; ADS1263 first-power-up diagnostic — M7-only build
;
; Single-environment, single-core sketch deliberately. The dual-core
; (M7-bridge + M4-sampler) machinery from SensorHub_PIO is intentionally
; absent: for first power-up of new hardware, we want zero firmware
; complexity so any failure is provably wiring or hardware.
;
; Flash with:   pio run -t upload
; Monitor with: pio device monitor   (115200 baud)

[env:portenta_m7_diag]
platform = ststm32
board = portenta_h7_m7
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_PORTENTA_H7_M7
    -DCORE_CM7
upload_protocol = dfu
