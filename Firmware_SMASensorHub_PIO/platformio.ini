; PlatformIO Project Configuration — Firmware_SMASensorHub_PIO
;
; COMBINED firmware: dual-ADC sensing (M4) + SMA drive path (M7) on ONE
; Portenta H7 image pair. This is the merge of:
;   - Firmware_SensorHub_PIO   (M4 dual-ADS1263 sampler + M7 ring→USB bridge)
;   - Firmware_SMADriver_PIO   (M7 MCP4728→TPS7A57 LDO→MOSFET SMA controller)
;
; The two were validated separately; this project runs them together.
; M4 is UNCHANGED from SensorHub (pure sensing into the SRAM4 ring).
; M7 gains a SECOND job: besides draining the sensor ring to USB and
; emitting [STATUS] telemetry, it now also runs the SMA driver as a
; NON-BLOCKING state machine (set/drive/fire/step/sweep/read/abort).
;
; Pin non-overlap (why this merge is safe — see README §Pin map):
;   M4 (sensing) : PA_8 (CS), PC_6 (DRDY), PC_7 (RESET) + SPI bus
;   M7 (SMA)     : Wire/I2C (PB_6/PB_7), A0 (FB), A1 (I-sense),
;                  PG_7 (MOSFET / D3), PJ_11 (scope TRIG)
;
; ── Flash order (first time) ──────────────────────────────────────────
;   pio run -e portenta_m7  -t upload     ; M7: bridge + SMA controller
;   pio run -e portenta_m4  -t upload     ; M4: dual-ADC sampler
;   pio device monitor                    ; 115200 baud
; Thereafter re-flash whichever core you changed. M7 is no longer a
; "flash once" bridge — it carries the SMA logic, so re-flash it when
; the SMA control code changes.
;
; ── Power-cycle the rig after EVERY upload ────────────────────────────
; The dfu reset does not cleanly re-power the EVM's analog rails; the
; ADS1263 comes up with ID=0x00 if you skip the cycle. Unplug USB + EVM
; supply, wait ~5 s, reapply, reopen the monitor.
;
; ── COM-port pinning ──────────────────────────────────────────────────
; Rig has Zaber stage on COM5 (FTDI 0403:6001) and Portenta H7 on COM13
; (Arduino 2341:025B). PIO would otherwise auto-pick the Zaber and wedge
; it. Override per-host on the CLI: `--upload-port COMx` (wins over .ini).

[platformio]
default_envs = portenta_m4

[env]
upload_port  = COM13
monitor_port = COM13

; ── M4 application: dual-ADC sampler (identical behaviour to SensorHub) ─
[env:portenta_m4]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra

; ── M7 application: ring→USB bridge + SMA controller ──────────────────
; lib_deps live here (not in [env]) because only the M7 image links the
; MCP4728 / BusIO libraries; the M4 sampler must not drag them in.
;
; SMA STREAM RATE (2026-07-13): the in-cycle src=3/4/5 V/I/R stream runs at
; ~1 kHz (96 points per 100 ms fire; it was 8). The defaults live in main.cpp
; and came from the rate ladder in Firmware_SMARateTest_PIO (winning env
; portenta_m7_rate1k_n4, verified on the rig):
;
;   CYCLE_LOG_MS_CFG   1    in-cycle stream period (ms)  -> ~1 kHz
;   ADC_SAMPLES_CYCLE  4    ADC readings averaged per in-cycle sample
;   ADC_SAMPLES_IDLE   64   ... per idle/manual/settle read (unchanged)
;   SMA_SETTLE_US      50   post-mux settle (was delay(1) = 1000 us)
;   SMA_STAMP_M7       1    stamp SMA lines with M7's clock, not M4's
;
; Counterintuitively this does FEWER ADC conversions per second than the old
; 100 Hz config (9,620 vs 12,480) while reporting 10x the samples — the 64x
; averaging moved off the ADC and onto the host. That matters because ADC
; conversion duty sags the reference and inflates V and I (R = V/I is immune).
; Do not raise ADC_SAMPLES_CYCLE to "improve precision": it would raise the
; duty and make V/I read HIGH. Average in post instead.
[env:portenta_m7]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
lib_deps =
    adafruit/Adafruit MCP4728 @ ^1.0.10
    adafruit/Adafruit BusIO  @ ^1.14.0
build_flags =
    -Wall
    -Wextra

; ── M7 rollback: the pre-2026-07-13 100 Hz SMA stream ─────────────────
; One-command way back if the 1 kHz stream misbehaves on the bench (dropped
; samples, or V/I means that shift vs the old sessions). Restores the old
; cadence and averaging, but KEEPS the batched write and the M7 timestamp —
; those are pure wins and are not what would break.
;   pio run -e portenta_m7_legacy100 -t upload   ; then power-cycle USB + EVM
[env:portenta_m7_legacy100]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D CYCLE_LOG_MS_CFG=10
    -D ADC_SAMPLES_CYCLE=64
    -D SMA_SETTLE_US=1000

; ── M7 UDP-transport build (Step 2 of the UDP migration) ──────────────
; Same M7 firmware, but the src=1..5 sample stream goes out over UDP (Ethernet,
; static IP 169.254.245.50) once the host sends `netcfg <pc_ip> <port>` over the
; serial command channel. Fire-and-forget -> the M7 loop never blocks on a slow
; host, so the SMA cool timing holds. Commands + [STATUS] + boot stay on USB-CDC.
; See docs/UDP_stream_migration_plan.md.
;   pio run -e portenta_m7_udp -t upload    ; then POWER-CYCLE USB + EVM
[env:portenta_m7_udp]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D H7_TRANSPORT_UDP=1

; ── M4 idle stub (bring-up only) ──────────────────────────────────────
; Flashes a do-nothing M4 image (empty setup + __WFI loop) via the
; -D M4_IDLE flag. Use it to test the M7 SMA path in ISOLATION — no SPI
; traffic, no ring writes — when isolating an SMA-side problem during a
; checkpoint. The normal run uses [env:portenta_m4] (full sampler).
;   pio run -e portenta_m4_idle -t upload   ; wipe M4 to idle
;   power-cycle, then flash/monitor M7
[env:portenta_m4_idle]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
    -D M4_IDLE
