# SMA THERMAL characterization recorder config (forked from V3)
#
# One file to set every instrument + sensor parameter for a session.
# Durations: seconds. Frequencies: Hz. Voltages: V. Distances: mm.
#
# Design rule: the RECORDER only configures instruments at startup and logs
# RAW streams. It does NOT convert units or push calibration to firmware.
# The `calibration:` block is consumed ONLY by analyze_sma.py (offline).

# ── LCR meter ─────────────────────────────────────────────────────────
# REMOVED from this thermal module: the console does not connect to, record,
# or control an LCR. `enabled: false` is authoritative; the console also
# hard-disables it (build_core never constructs an LcrWorker).
lcr:
  enabled: false

# ── Portenta H7 (combined firmware: sensors + SMA on one USB-CDC port) ──
# Streams src=1 laser, 2 load, 3 SMA V, 4 SMA I, 5 SMA R, and — with the
# constant-current fork (Firmware_SMAConstantCurrent_PIO) — 6 CC command u,
# 7 CC R_est. The recorder logs every enabled channel raw; demux + scaling
# happen offline in the analyzer. Channels the firmware never emits simply
# stay absent from the CSV, so this list is safe with EITHER image.
#
# NOTE (2026-07-24): src=3 is the voltage at SMA_P (A0, after the shunt), i.e.
# V_sma directly — NOT the LDO output. Older sessions recorded it as V_ldo.
h7:
  enabled: true
  port: COM8
  baud: 115200
  channels: [laser, load, sma_v, sma_i, sma_r, cc_u, cc_r] # which src to keep
  startup_commands: [] # optional cmds sent to H7 at startup (e.g.
    #   ["gain 10", "shunt 0.1"]). EMPTY by default —
    #   the recorder stays a pure logger. Inert hook
    #   for future scripted actuation.
  # Isolate the serial reader from the camera/GUI so heavy camera work can't
  # starve it (starvation back-pressures the M7 and distorts cycle timing).
  reader_priority: above_normal # normal | above_normal | highest ("normal" = off)
  reader_core: -1 # -1 = auto (last logical core); >=0 = pin to that core; <=-2 = off
  # Sample-stream transport. "usb" = serial (default). "udp" needs the
  # portenta_m7_udp firmware: the src=1..7 stream arrives over Ethernet
  # (fire-and-forget) so a busy host can't stall the M7 / distort SMA timing.
  # Commands + [STATUS] stay on `port`. See docs/UDP_stream_migration_plan.md.
  #
  # TRAP: this must MATCH THE FLASHED ENV. `transport: udp` with a plain
  # `portenta_m7` image = the recorder sits there logging nothing (the samples
  # go out the USB port it isn't reading). Both firmware projects carry a
  # `portenta_m7_udp` env, including the CC fork:
  #   pio run -e portenta_m7_udp -t upload   # then POWER-CYCLE USB + EVM
  # 2026-07-28: set back to `usb` — the board is running the plain `portenta_m7`
  # image, so it streams over USB and `udp` hit the trap above (recv=0, h7.csv
  # empty; session console_20260728_112825). Verified by reading COM8 directly:
  # 987 lines/s of src=1/2. Worse than logging nothing: in `udp` the console
  # holds COM8 open but never DRAINS it, so the M7 blocks in Serial.write and
  # wedges — no boot banner, then every command write fails ERROR_BAD_COMMAND
  # ("The device does not recognize the command"), which needs a power cycle.
  # Before switching back to `udp`, BOTH must be true: (1) `portenta_m7_udp` is
  # actually flashed, and (2) this host really has the `pc_ip` below on a NIC
  # linked to the H7 — on 2026-07-28 it did not (Ethernet was campus DHCP
  # 141.212.82.60; nothing held 169.254.245.100).
  transport: usb # usb | udp
  udp_port: 7777 # host bind port for the UDP stream
  pc_ip: 169.254.245.100 # host IP the H7 streams to (sent via netcfg)

# ── Zaber linear stage (X-LSQ300A-E01) ────────────────────────────────
stage:
  enabled: true
  port: COM5 # null = auto-detect Zaber (FTDI 0403:6001)
  position_limits_mm: [40, 150] # firmware/software travel clamp for THIS workflow
  max_velocity_mm_s: 10.0
  reading_rate_hz: 100
  home_on_start: false # NEVER move at launch — homing once crushed the
  move_to_zero_on_start:
    false #  fixture. The stage stays exactly where it is;
    #  the operator jogs it manually (home/go buttons).
  zero_mm: 40.0 # manual go-to default only (NOT auto-applied at start)
  poll_interval_s: 0.02 # ~50 Hz position poll

# ── 12MP camera (adaptive-FPS video; fixed resolution) ────────────────
# Recording is gated by the console's Start/Stop REC. Frame rate adapts to SMA
# motion from the laser: fast while moving, heartbeat once settled (net move <
# change_threshold_mm for stop_dwell_s). resolution + fps_fast apply on
# (re)connect; the rest are live. Editable from the console (resolution + fast
# fps dropdowns, transient + heartbeat fields). Auxiliary: a failure warns.
camera:
  enabled: true
  use_subprocess: true # true = run the camera in its OWN process (separate
  #   GIL/core) so camera CPU can never stall the H7 reader/GUI. Same USB port;
  #   preview comes back over IPC. false = in-thread (default; lighter).
  index: 0 # DirectShow index of the 12MP U3 camera (VID_32E4 PID_6577). NOTE:
  # DSHOW index is positional, not pinned to the device — it was 1 when the
  # Lenovo built-in webcam occupied 0; with the built-in absent the 12MP is 0.
  # If capture fails with "can't be used to capture by index", re-probe indices.
  resolution: [1920, 1080] # 1080p is the camera's fast MJPG mode. AVOID 1280x720:
  # this sensor has NO MJPG descriptor at 720p, so DSHOW falls back to raw YUY2
  # and caps at 10 fps. Measured MJPG rates: 1080p=85, 1440p=48, 4000x3000=15 fps.
  fps_fast: 60 # RECORDING rate at 1080p MJPG (85 fps ceiling; 60 has margin).
  # This is the capture stream — keep it high so recording is fast. The live
  # preview does NOT run at this rate; it samples the stream (see preview_* below).
  fps_heartbeat: 1.0 # sparse rate once the SMA has settled
  transient_guarantee_s: 1.0 # force fast this long after a heat/idle event
  change_threshold_mm: 1.0 # net (median-filtered) laser move that counts
  median_window_ms: 200 # laser noise/jump rejection
  stop_dwell_s: 4.0 # no >threshold move this long -> drop to heartbeat
  jpeg_quality: 90
  # ── Live view (cheap; independent of recording) ──────────────────────
  preview_hz: 10 # frames/s DECODED for the on-screen view (the CPU lever).
  #   Lower = cheaper live view, no effect on recording fps. ~16 ms/decode at
  #   1080p, so 10 Hz ≈ 16% of one core; 5 Hz ≈ 8%. Recording still gets fps_fast.
  preview_width: 400 # downscaled display width (px); smaller = lighter to draw
  reconnect_timeout_s: 6.0 # watchdog: no good frame this long -> reopen. Keep it
  # WELL above the camera's own open+first-frame latency (measured ~4.5 s on the
  # 12MP). At the old 2.0 s the watchdog fired before the stream had started, and
  # every reopen cost another 4.5 s — a reopen loop that never delivers a frame
  # and holds the device against the next run (see STATUS.md 2026-07-28).

# ── SMA cyclic actuation (the ON-M7 experiment state machine) ─────────
# The firmware runs the heat/cool cycle deterministically off M7's own
# clock — the PC is NOT in the timing loop. With enabled=true the recorder
# sends one `cycle …` at RAW start, a `ping` heartbeat each second, and
# `stop` at the end. enabled=false → recorder is a pure logger (drive the
# SMA manually from the H7 console).
sma:
  enabled: false
  # Actuation mode. "voltage" = `cycle` (every session recorded to date).
  # "current" = `cccycle`, and REQUIRES Firmware_SMAConstantCurrent_PIO — the
  # sensor-hub image rejects cc* commands (you'll see the rejection as an
  # [SMA] line; it does not silently mis-actuate).
  # The current levels are SEPARATE fields from v_high/v_low on purpose: a
  # mode flip must never reinterpret a number that meant volts as milliamps.
  mode: voltage # voltage | current
  v_high: 3.0 # heating/actuation voltage (V)
  v_low:
    0.5 # idle / cooling level (V). 0.5 V ≈ 0.12 A — a
    #   non-heating rest current so V/I/R is readable
    #   at arm (0 V = no current = nothing to read)
  fire_ms: 100 # heating duration per cycle
  cool_ms: 3000 # cooling duration per cycle
  n_cycles: 10 # 0 = continuous until RAW stop
  wdt_ms:
    5000 # M7 heartbeat watchdog timeout (0 = off);
    #   recorder pings every 1 s when driving
  # ── Constant-current levels + tuning (mode: current only) ────────────
  # Firmware ceiling is 2000 mA; the loader rejects anything outside it at
  # load time rather than letting the M7 reject it mid-session.
  i_high_ma: 200.0 # heat current (mA)
  i_low_ma:
    0.0 # cool current (mA). 0 = open the loop and park at
    #   the idle VOLTAGE v_low above (the firmware's own
    #   convention), rather than regulating a low current.
  tau_ms:
    7.0 # closed-loop time constant. 7 ms is the firmware
    #   default, inherited from the Uno validation — the
    #   plant (TPS7A57 soft-start), not the MCU, sets the
    #   floor. Tune on a LOAD-CHANGE test, never on a
    #   step-from-zero. 0 = leave the firmware default.
  ccgain: 0.0 # proportional term; 0 = pure integral (default)

# ── Baseline / sensor-zero phase (cold R + laser/load tare) ───────────
# A quiescent "go-to-defined-start" companion: ARMS at a LOW, non-heating
# probe voltage, streams V/I/R + laser/load briefly, and captures per-session
# zero references — cold SMA resistance, laser rest voltage, load-cell tare —
# then AUTO-DISARMS. Run it before actuating (operator button, or auto below).
baseline:
  enabled: true
  auto_on_start: false # true = run automatically after the health check
  probe_v: 0.5 # non-heating probe voltage (V); ~= idle, ~0.12 A
  duration_s: 2.0 # averaging window
  settle_s: 0.3 # skip the initial transient before averaging
  apply_load_offset: true # tare: write measured load rest V → load_cell.offset_V
  load_saturation_warn_frac: 0.8 # warn if |V_rest| exceeds this fraction of ±5 V

# ── Phase durations (OPEN/SHORT LCR de-embed calibration) ─────────────
phases:
  open_duration_s: 20.0 # OPEN calibration recording window
  short_duration_s: 20.0 # SHORT calibration recording window
  # RAW (experiment) runs until Ctrl+C.

# ── Calibration coefficients — ANALYSIS ONLY (not applied by recorder) ─
# Filled from Calibrate_LaserHead / Calibrate_LoadCell. analyze_sma.py uses
# these to convert raw voltages → physical units. null = leave raw.
calibration:
  laser:
    # From Calibrate_LaserHead/calibration.json (2026-05-27 run09, bare EVM;
    # R²=0.99999). displacement_um = (V_mV − V0_mV) / k_mV_per_um.
    k_mV_per_um: -0.49779577092171906
    V0_mV: 2503.7500968693835
  load_cell:
    # From Calibrate_LoadCell/calibration.json (2026-05-28 run07; sensitivity
    # 10.2009 V/N, V0 = −34.1855 mV). Converted to this schema
    # (force_N = scale·(V − offset)):  scale_N_per_V = 1/sensitivity_V_per_N,
    # offset_V = V0_mV/1000. Carries ~5 mN fwd/rev hysteresis (see that json).
    scale_N_per_V: 0.09803089999362627
    offset_V: -0.03418552305418667
  current_sense: # firmware INA296A defaults — recorded for
    gain_V_per_V: 10.0 # traceability (the analyzer trusts the
    shunt_ohm: 0.2 # firmware-streamed src=4 I / src=5 R directly;
    ioffset_V: 0.0 # these only matter if recomputing from raw).
    # shunt 0.1 -> 0.2 on 2026-07-24: 200 mOhm is the part actually fitted.
    # Corrected in Firmware_SMAConstantCurrent_PIO; the sensor-hub image still
    # ships 0.1 (see its STATUS.md TODO), so sessions recorded with THAT image
    # have src=4 I 2x high and src=5 R 2x low regardless of this metadata.

# ── Run metadata ──────────────────────────────────────────────────────
run:
  operator: "" # filled into meta.json
  notes: "" # free-form, also in meta.json
  output_dir: data # relative to sma_recorder.py (or absolute)
