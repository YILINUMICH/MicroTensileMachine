; ADS1263_NoiseFloor_PIO — full SPS × PGA noise-floor sweep
;
; Phase 1.2 of ../doc/MEMO_baseline_testing.md.
;
; Single-environment, M7-only by deliberate choice — same convention as
; ADS1263_FirstPowerUp_PIO. The sketch sweeps INPMUX = 0xAA (AINCOM-shorted)
; across all combinations of PGA gain and data rate, prints a CSV over USB
; serial, and halts. A Python script in tools/ summarizes the CSV against
; ADS1263 datasheet Table 7.10.
;
; Flash with:   pio run -t upload
; Monitor with: pio device monitor   (115200 baud, capture to file)

[env:portenta_m7_noisefloor]
platform = ststm32
board = portenta_h7_m7
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_PORTENTA_H7_M7
    -DCORE_CM7
upload_protocol = dfu
