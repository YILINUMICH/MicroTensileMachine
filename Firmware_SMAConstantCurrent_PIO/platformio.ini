; PlatformIO Project Configuration — Firmware_SMAConstantCurrent_PIO
;
; FORK of Firmware_SMASensorHub_PIO adding a closed-loop CONSTANT-CURRENT
; controller to the M7 SMA drive path. The parent stays the production /
; rollback image; this project is where the current loop is developed and
; bench-verified. M4 is byte-identical to the parent (pure sensing).
;
; The control law is the port of the Uno-validated design in
;   GelBot/PIConstantCurrent/CONTROL_SKELETON.md  (§3 control law, §8 pitfalls)
; See README.md here for what carried over and what the H7 changed.
;
; ── Flash order (first time) ──────────────────────────────────────────
;   pio run -e portenta_m7  -t upload     ; M7: bridge + SMA + CC loop
;   pio run -e portenta_m4  -t upload     ; M4: dual-ADC sampler
;   pio device monitor                    ; 115200 baud
; Thereafter re-flash whichever core you changed. The CC work is ALL on M7,
; so day-to-day this is an M7-only reflash.
;
; ── Power-cycle the rig after EVERY upload ────────────────────────────
; The dfu reset does not cleanly re-power the EVM's analog rails; the
; ADS1263 comes up with ID=0x00 if you skip the cycle. Unplug USB + EVM
; supply, wait ~5 s, reapply, reopen the monitor.
;
; ── COM-port pinning ──────────────────────────────────────────────────
; Rig has Zaber stage on COM5 (FTDI 0403:6001) and Portenta H7 on COM8
; (Arduino 2341:025B). PIO would otherwise auto-pick the Zaber and wedge
; it. Override per-host on the CLI: `--upload-port COMx` (wins over .ini).

[platformio]
default_envs = portenta_m7

[env]
upload_port  = COM8
monitor_port = COM8

; ── M4 application: dual-ADC sampler (identical to the parent project) ─
[env:portenta_m4]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra

; ── M7 application: ring→USB bridge + SMA controller + CC loop ────────
; lib_deps live here (not in [env]) because only the M7 image links the
; MCP4728 / BusIO libraries; the M4 sampler must not drag them in.
;
; Inherited defaults that the CC loop depends on (see main.cpp for the full
; reasoning — these came from the rate ladder in Firmware_SMARateTest_PIO):
;   CYCLE_LOG_MS_CFG   1    stream period (ms)          -> ~1 kHz telemetry
;   ADC_SAMPLES_CYCLE  4    ADC readings per in-cycle sample
;   ADC_SAMPLES_IDLE   64   ... per idle/manual/settle read
;   SMA_SETTLE_US      50   post-mux settle
; Do NOT raise ADC_SAMPLES_CYCLE to "improve precision": more conversions
; raise the ADC's duty, which sags its reference and makes V and I read HIGH.
; For a CURRENT controller that is a systematic target error, not just noise
; (R = V/I is immune, the current setpoint is not). Average on the host.
;
; CC-specific:
;   CC_PERIOD_US_CFG   1000  control period (us) -> 1 kHz control rate
[env:portenta_m7]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
lib_deps =
    adafruit/Adafruit MCP4728 @ ^1.0.10
    adafruit/Adafruit BusIO  @ ^1.14.0
build_flags =
    -Wall
    -Wextra

; ── M7 loop profiler (DIAGNOSTIC, 2026-07-27) ─────────────────────────
; Partitions every loop() pass (pump / cmd / sma / hb) plus the in-cycle
; costs (ccStep / readSma / emit) and prints [PROF] once a second.
;
; WHY: the rate-test project sustains 957 Hz at ADC_SAMPLES_CYCLE=4 with a
; per-tick DAC write (measured there: readSma 220 us, dac 365 us, emit 60 us).
; CC's HEAT phases agree (loop_hz 961-1501) but its COOL phases run 479 Hz —
; 3x slower while doing strictly LESS work. `log_fires` vs `phase_passes`
; tests the leading suspect: the voltage-mode branch advances cyc_next_log
; without the snap-forward guard the cc branch has, so once behind it samples
; EVERY pass instead of on schedule.
;   pio run -e portenta_m7_prof -t upload
[env:portenta_m7_prof]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D DBG_LOOP_PROFILE=1

; ── M7 slow-loop build: 200 Hz control, matching the Uno ──────────────
; The A/B build for bring-up. The Uno ran this loop at ~200 Hz and the design
; is validated there, so if the 1 kHz build misbehaves (ringing, a starved
; sensor drain, cc_hz far below nominal) this isolates "the port is wrong"
; from "the rate is wrong" in one flash. tau's default (7 ms) is the Uno's, so
; at this period the loop is as close to the validated build as the H7 gets.
;   pio run -e portenta_m7_cc200 -t upload   ; then POWER-CYCLE USB + EVM
[env:portenta_m7_cc200]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D CC_PERIOD_US_CFG=5000

; ── M7 with the I2C bus at the sensor-hub speed ───────────────────────
; DIAGNOSTIC. Firmware_SMASensorHub_PIO never calls Wire.setClock(), so it runs
; the DAC bus at the 100 kHz default; this fork raises it to 400 kHz for the
; control loop's output stage. That is the ONLY I2C difference between the two
; images, so if the MCP4728 enumerates reliably under the sensor hub but
; intermittently here, this env isolates speed as the cause in one flash.
;
; A bus that works ONLY at 100 kHz is marginal and should be fixed at the
; hardware (pull-ups, lead length, level translation) — this env proves the
; diagnosis, it does not cure it. Cost: a 3-byte DAC write goes ~70 us -> ~270
; us, i.e. 27% of a 1 ms control tick (tolerable at cc200's 5 ms tick: ~5%).
;   pio run -e portenta_m7_i2c100 -t upload   ; then POWER-CYCLE USB + EVM
[env:portenta_m7_i2c100]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D I2C_HZ=100000

; ── M7 rollback: the pre-2026-07-13 100 Hz SMA stream ─────────────────
; Inherited from the parent project. Restores the old telemetry cadence and
; 64x averaging (keeping the batched write + M7 timestamp). Note this also
; slows the CC telemetry to 100 Hz; the control loop itself still runs at
; CC_PERIOD_US.
;   pio run -e portenta_m7_legacy100 -t upload   ; then power-cycle USB + EVM
[env:portenta_m7_legacy100]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D CYCLE_LOG_MS_CFG=10
    -D ADC_SAMPLES_CYCLE=64
    -D SMA_SETTLE_US=1000

; ── M7 UDP-transport build ────────────────────────────────────────────
; Same M7 firmware, but the src=1..7 sample stream goes out over UDP
; (static IP 169.254.245.50) once the host sends `netcfg <pc_ip> <port>`.
; Fire-and-forget -> the M7 loop never blocks on a slow host, which matters
; MORE with the CC loop running: a blocked write stalls control ticks, not
; just telemetry. See docs/UDP_stream_migration_plan.md.
;   pio run -e portenta_m7_udp -t upload    ; then POWER-CYCLE USB + EVM
[env:portenta_m7_udp]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D H7_TRANSPORT_UDP=1

; ── M7 wedge diagnostic: STOCK blocking TX + RGB LEDs + IWDG ──────────
; DIAGNOSTIC baseline for the USB wedge investigation (SOLVED 2026-08-07 —
; see STATUS.md top entry: the wedge is the Windows usbser.sys driver
; instance dying, healed by the nbtx build below). Keeps the STOCK
; blocking TX so the wedge stays reproducible for future A/B, plus the
; RGB diagnostic (green = loop alive, blue = cached DTR flag, red = RX
; activity; mbed's red death-blink shows through on a crash) and the 4 s
; IWDG. Reproduce with tools/torture_open_close.py.
;   pio run -e portenta_m7_wedgeled -t upload   ; then POWER-CYCLE USB + EVM
[env:portenta_m7_wedgeled]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D DBG_LOOP_LED=1
    -D H7_LOOP_WDT_S=4

; ── M7 nbtx: the wedge-proof image (campaign candidate) ───────────────
; The full fix stack, bench-verified 2026-08-07 (wedge → streaming again
; in ~41 s, twice, no human intervention):
;   TX_NONBLOCK        bounded send_nb TX — no loop stalls/hangs on a dead
;                      host; drops counted (tx_drop), never silent
;   H7_LOOP_WDT_S=4    IWDG auto-reset for the (rarer) M7-crash wedge mode;
;                      boot banner reports the reset cause
;   H7_USB_SELFHEAL_S  windowed link-health check: a dead 30 s window
;                      (<4 KB accepted) triggers a 1.5 s USB re-enum that
;                      rebuilds the wedged HOST usbser.sys instance,
;                      escalating to disarm+reset on a second dead window;
;                      usb_heal=N in [STATUS] counts events
; Wire format unchanged. ACCEPTANCE before campaign use: one full sweep
; with tx_drop~0, usb_heal=0, rate1/2=512, clean sweep report.
; ROLLBACK: flash [env:portenta_m7] (byte-identical to pre-fix).
;   pio run -e portenta_m7_nbtx -t upload   ; then POWER-CYCLE USB + EVM
[env:portenta_m7_nbtx]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D TX_NONBLOCK=1
    -D DBG_LOOP_LED=1
    -D H7_LOOP_WDT_S=4
    -D H7_USB_SELFHEAL_S=30

; ── M4 idle stub (bring-up only) ──────────────────────────────────────
; Flashes a do-nothing M4 image (empty setup + __WFI loop) via -D M4_IDLE.
; Use it to bring the CC loop up in ISOLATION — no SPI traffic, no ring
; writes, nothing else competing for the M7 loop — so cc_hz reflects the
; controller's own cost. The normal run uses [env:portenta_m4].
;   pio run -e portenta_m4_idle -t upload   ; wipe M4 to idle
;   power-cycle, then flash/monitor M7
[env:portenta_m4_idle]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
    -D M4_IDLE
