# =============================================================================
# LoadCell Calibration — Experiment Parameters
# =============================================================================
# These are experiment parameters for a single calibration sweep using the
# BMX spring as a transfer standard. The Zaber stage applies known
# displacements to the spring; force is computed as F = k_spring * dx.
#
# Hardware configuration for the Zaber stage lives in Driver_ZaberStage/*.json —
# do NOT duplicate it here.
#
# All distances are in millimeters, all times in seconds, forces in mN.
# =============================================================================

# --- Spring transfer standard ------------------------------------------------
# Instron-characterised BMX spring (doc/spring loadcell/spring_loadcell_summary.csv).
# Pooled from 4 runs on a 2530-100N cell: k = 30.857 mN/mm, R^2 = 0.99995.
spring_k_mN_per_mm: 30.86
spring_k_uncertainty_pct: 0.4        # run-to-run CV from Instron (0.26%) + cell spec (~0.3%)

# --- Stage sweep geometry ----------------------------------------------------
# sweep_start_mm: absolute Zaber position where the sweep begins. Set this
# a few mm before the point where the spring engages the load cell (the
# "soft zone"). analyze.py auto-detects where the linear region starts, so
# you don't need to nail the zero exactly — just start early enough.
#
# The stage moves from sweep_start_mm in the POSITIVE direction (increasing
# position = increasing spring deflection = increasing force). If your rig
# geometry is reversed, swap sweep_start_mm and direction.
sweep_start_mm: 10.0                 # bench-verified — spring just relaxed at this absolute position
max_force_gf: 45                     # target ceiling (~441 mN, ~14.3 mm travel)
step_size_mm: 0.5                    # ~29 points across the force range
direction: bidirectional             # forward_only | bidirectional
passes: 2                           # >1 gives pass-to-pass repeatability data

# --- Cross-compare -----------------------------------------------------------
# When true, BOTH ADC1 and ADC2 sample AIN2/AIN3 simultaneously. ADC1 (32-bit)
# is the primary high-resolution channel; ADC2 (24-bit) is the independent
# digital-path cross-check. Requires Calibrate_Loadcell_PIO flashed with
# ENABLE_ADC1=1 and ENABLE_ADC2=1 (both ADCs muxed to AIN2/AIN3).
xcompare: true

# --- Timing ------------------------------------------------------------------
settle_time_s: 1.5                   # mechanical ringdown after each stage move
stage_velocity_mm_s: 0.5             # slow enough that settle_time is comfortable

# --- Sampling ----------------------------------------------------------------
samples_per_point: 500               # ~1.25 s at 400 SPS per ADC
baseline_samples: 500                # before and after sweep, at start position
drain_timeout_s: 2.0                 # max time spent draining the serial buffer

# --- Serial I/O --------------------------------------------------------------
# Portenta H7 (load cell ADC stream) — USB-CDC.
# Signal chain: Load cell → LCA-9PC amp (0-5 V) → EVM AIN2(+)/AIN3(-)
#   → ADC1 (32-bit) + ADC2 (24-bit) → M4 → ring buffer → M7 → USB.
portenta_port: "COM8"
portenta_baud: 115200

# Zaber stage.
zaber_config_path: ../Driver_ZaberStage/safety_config.json
zaber_port: "COM5"

# --- Run metadata ------------------------------------------------------------
operator: ""
notes: ""

# --- Dry-run override --------------------------------------------------------
# Activated via --dry-run flag. Validates the full pipeline in ~1 minute.
dry_run:
  max_force_gf: 5                    # ~1.6 mm travel, ~3 points
  step_size_mm: 1.0
  direction: forward_only
  passes: 1
  samples_per_point: 20
  baseline_samples: 50
