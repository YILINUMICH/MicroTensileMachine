; PlatformIO Project Configuration — Firmware_SMARateTest_PIO
;
; TEST FORK of Firmware_SMASensorHub_PIO. Purpose: find the SMA V/I/R
; sampling-rate sweet spot during the 100 ms fire WITHOUT touching the
; production firmware. Identical to SensorHub except:
;   1. readADC()/readLDO()/readSma() take a sample count (was fixed 64).
;   2. The heat/cool actuation path averages ADC_SAMPLES_CYCLE samples
;      (default 16) instead of 64; idle/settle/manual keep 64.
;   3. Each in-cycle + idle read emits a monitor-only [RATE] line with the
;      measured readSma() duration in microseconds, so we get the REAL
;      cost (the offline host-clock estimate was swamped by Windows jitter
;      and the SRAM4 ring decoupling — see STATUS.md).
;
; M4 is byte-for-byte the production sampler (pure sensing into the ring).
; Only the M7 image differs, and only in the SMA read path.
;
; ── Rate sweep ────────────────────────────────────────────────────────
; Flash the M4 once, then A/B the M7 cycle-sample count by env — no code
; edits needed. Each env just overrides -D ADC_SAMPLES_CYCLE.
;   pio run -e portenta_m4       -t upload   ; sampler (once)
;   pio run -e portenta_m7_cyc16 -t upload   ; default 16-sample in-cycle
;   pio run -e portenta_m7_cyc8  -t upload   ; try 8
;   pio run -e portenta_m7_cyc4  -t upload   ; try 4
;   pio run -e portenta_m7_cyc32 -t upload   ; try 32 (near-baseline noise)
;   pio device monitor                       ; 115200 — watch [RATE] lines
; → Power-cycle the rig (USB + EVM supply) after EVERY upload, or the
;   ADS1263 comes up ID=0x00.
; → COM8 = Portenta H7, COM5 = Zaber. Override with --upload-port COMx.

[platformio]
default_envs = portenta_m7_cyc16

[env]
upload_port  = COM8
monitor_port = COM8

; ── M4 application: dual-ADC sampler (identical to SensorHub) ──────────
[env:portenta_m4]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra

; ── M4 idle stub (bring-up only) ──────────────────────────────────────
[env:portenta_m4_idle]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
    -D M4_IDLE

; ── M7 base: ring→USB bridge + SMA controller (rate-test build) ───────
; Concrete envs below inherit this and set ADC_SAMPLES_CYCLE.
[m7_base]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
lib_deps =
    adafruit/Adafruit MCP4728 @ ^1.0.10
    adafruit/Adafruit BusIO  @ ^1.14.0
build_flags =
    -Wall
    -Wextra

[env:portenta_m7_cyc16]
extends     = m7_base
build_flags = ${m7_base.build_flags} -D ADC_SAMPLES_CYCLE=16

[env:portenta_m7_cyc8]
extends     = m7_base
build_flags = ${m7_base.build_flags} -D ADC_SAMPLES_CYCLE=8

[env:portenta_m7_cyc4]
extends     = m7_base
build_flags = ${m7_base.build_flags} -D ADC_SAMPLES_CYCLE=4

[env:portenta_m7_cyc32]
extends     = m7_base
build_flags = ${m7_base.build_flags} -D ADC_SAMPLES_CYCLE=32
