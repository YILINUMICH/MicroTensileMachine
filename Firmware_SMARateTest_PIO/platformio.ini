; PlatformIO Project Configuration — Firmware_SMARateTest_PIO
;
; TEST FORK of Firmware_SMASensorHub_PIO. Purpose: find the SMA V/I/R
; sampling-rate sweet spot during the 100 ms fire WITHOUT touching the
; production firmware. Identical to SensorHub except:
;   1. readADC()/readLDO()/readSma() take a sample count (was fixed 64).
;   2. The heat/cool actuation path averages ADC_SAMPLES_CYCLE samples
;      (default 16) instead of 64; idle/settle/manual keep 64.
;   3. Each in-cycle + idle read emits a monitor-only [RATE] line with the
;      measured readSma() duration in microseconds, so we get the REAL
;      cost (the offline host-clock estimate was swamped by Windows jitter
;      and the SRAM4 ring decoupling — see STATUS.md).
;
; M4 is byte-for-byte the production sampler (pure sensing into the ring).
; Only the M7 image differs, and only in the SMA read path.
;
; ── Rate sweep ────────────────────────────────────────────────────────
; Flash the M4 once, then A/B the M7 cycle-sample count by env — no code
; edits needed. Each env just overrides -D ADC_SAMPLES_CYCLE.
;   pio run -e portenta_m4       -t upload   ; sampler (once)
;   pio run -e portenta_m7_cyc16 -t upload   ; default 16-sample in-cycle
;   pio run -e portenta_m7_cyc8  -t upload   ; try 8
;   pio run -e portenta_m7_cyc4  -t upload   ; try 4
;   pio run -e portenta_m7_cyc32 -t upload   ; try 32 (near-baseline noise)
;   pio device monitor                       ; 115200 — watch [RATE] lines
; → Power-cycle the rig (USB + EVM supply) after EVERY upload, or the
;   ADS1263 comes up ID=0x00.
; → COM8 = Portenta H7, COM5 = Zaber. Override with --upload-port COMx.

[platformio]
default_envs = portenta_m7_cyc16

[env]
upload_port  = COM8
monitor_port = COM8

; ── M4 application: dual-ADC sampler (identical to SensorHub) ──────────
[env:portenta_m4]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra

; ── M4 idle stub (bring-up only) ──────────────────────────────────────
[env:portenta_m4_idle]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
    -D M4_IDLE

; ── M7 base: ring→USB bridge + SMA controller (rate-test build) ───────
; Concrete envs below inherit this and set ADC_SAMPLES_CYCLE.
[m7_base]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
lib_deps =
    adafruit/Adafruit MCP4728 @ ^1.0.10
    adafruit/Adafruit BusIO  @ ^1.14.0
build_flags =
    -Wall
    -Wextra

[env:portenta_m7_cyc16]
extends     = m7_base
build_flags = ${m7_base.build_flags} -D ADC_SAMPLES_CYCLE=16

[env:portenta_m7_cyc8]
extends     = m7_base
build_flags = ${m7_base.build_flags} -D ADC_SAMPLES_CYCLE=8

[env:portenta_m7_cyc4]
extends     = m7_base
build_flags = ${m7_base.build_flags} -D ADC_SAMPLES_CYCLE=4

[env:portenta_m7_cyc32]
extends     = m7_base
build_flags = ${m7_base.build_flags} -D ADC_SAMPLES_CYCLE=32


; ══════════════════════════════════════════════════════════════════════
;  RATE LADDER (2026-07-13) — push the SMA V/I/R stream toward 1 kHz.
;
;  The 2026-07-09 round proved readSma() is NOT the wall and that the
;  ADC_SAMPLES split is irrelevant. This round attacks the three costs that
;  actually gate the rate, all now build flags:
;
;    SMA_SETTLE_US    was delay(1) x2 = ~2000 us of pure delay per sample
;    (batched emit)   emitSmaSample did ~18 tiny USB-CDC writes per sample;
;                     now ONE Serial.write for all three rows (the same fix
;                     pumpSensors got, never applied to the SMA path)
;    SMA_STAMP_M7     M4's clock only advances every ~2 ms, so above ~500 Hz
;                     consecutive samples would share a timestamp
;    CYCLE_LOG_MS_CFG the schedule ceiling the stream now sits exactly on
;
;  Climb the ladder IN ORDER and stop at the first env that misbehaves.
;  After each upload: power-cycle USB + EVM, then
;      python rate_probe.py --port COM8
;  and read the achieved cadence off the [RATE] dt_us field and the
;  [STATUS] loop_hz / dropped / crc_err fields.
;
;  WHAT TO WATCH — a higher number in [RATE] is not automatically a win:
;    * dt_us should approach CYCLE_LOG_MS x 1000. If it plateaus ABOVE that,
;      the M7 loop (loop_us_avg) is the wall, not the schedule.
;    * [STATUS] dropped / crc_err must stay 0 — if the ring starts dropping,
;      the SMA path is starving the sensor drain.
;    * V and I MEAN values must not shift as SMA_SETTLE_US comes down. If
;      they move, the source has not settled and the reading is now WRONG.
;      This is the one failure mode that is silent — check it every step.
; ══════════════════════════════════════════════════════════════════════

; Rung 0 — control. Today's production behaviour, but with the new
; instrumentation, so we have an honest before-number to compare against.
[env:portenta_m7_rate100]
extends     = m7_base
build_flags = ${m7_base.build_flags}
    -D ADC_SAMPLES_CYCLE=64
    -D SMA_SETTLE_US=1000
    -D CYCLE_LOG_MS_CFG=10
    -D SMA_STAMP_M7=0

; Rung 1 — the two proven fixes only (short settle + batched write), rate
; unchanged. Isolates their cost saving: readSma_us and emit_us should both
; collapse while dt_us stays at 10000. Confirms V/I are unchanged.
[env:portenta_m7_rate100_fixed]
extends     = m7_base
build_flags = ${m7_base.build_flags}
    -D ADC_SAMPLES_CYCLE=64
    -D SMA_SETTLE_US=50
    -D CYCLE_LOG_MS_CFG=10

; Rung 2 — 200 Hz.
[env:portenta_m7_rate200]
extends     = m7_base
build_flags = ${m7_base.build_flags}
    -D ADC_SAMPLES_CYCLE=64
    -D SMA_SETTLE_US=50
    -D CYCLE_LOG_MS_CFG=5

; Rung 3 — 500 Hz. Keeps the full 64x averaging (precision preserved).
[env:portenta_m7_rate500]
extends     = m7_base
build_flags = ${m7_base.build_flags}
    -D ADC_SAMPLES_CYCLE=64
    -D SMA_SETTLE_US=50
    -D CYCLE_LOG_MS_CFG=2
    -D RATE_DECIM=5

; Rung 4 — 1 kHz, still 64x averaging. This is the honest first attempt:
; 64 reads x 2 channels x ~4.1 us = ~525 us, plus settle, inside a 1000 us
; budget. Tight. If dt_us will not come down to ~1000, drop to rate1k_n16.
[env:portenta_m7_rate1k]
extends     = m7_base
build_flags = ${m7_base.build_flags}
    -D ADC_SAMPLES_CYCLE=64
    -D SMA_SETTLE_US=50
    -D CYCLE_LOG_MS_CFG=1
    -D RATE_DECIM=10

; Rung 5 — 1 kHz with 16x averaging, if rung 4 cannot hold the cadence.
; NOTE THE TRADE: 64 -> 16 costs sqrt(4) = 2x in noise IF the noise is white.
; Our data says it is NOT (sigma_I = 138 LSB even AFTER 64x averaging — the
; interferer is low-frequency, so the 64 back-to-back reads all catch it at
; the same phase and cancel almost nothing). So this may be nearly free.
; MEASURE IT: compare the V/I sample scatter against rung 4, do not assume.
[env:portenta_m7_rate1k_n16]
extends     = m7_base
build_flags = ${m7_base.build_flags}
    -D ADC_SAMPLES_CYCLE=16
    -D SMA_SETTLE_US=50
    -D CYCLE_LOG_MS_CFG=1
    -D RATE_DECIM=10


; ══════════════════════════════════════════════════════════════════════
;  RUNGS 6-7 (2026-07-13, added after runs 0-5) — FIX THE ACCURACY BUG.
;
;  Runs 0-5 hit 962 Hz cleanly (no drops, no CRC errors) but FAILED the
;  accuracy gate: with the DAC code IDENTICAL (2003) in every run, the
;  measured V climbed 3.21 -> 4.28 V (+33%) and I climbed with it.
;
;  The error tracks ADC CONVERSION DUTY, not cadence — correlation +1.000:
;
;      run   cadence   ADC duty   V measured   error
;      0/1   10.4 ms      14%       3.211 V     0.0%   <- clean
;      2      5.2 ms      29%       3.427 V    +6.7%
;      5      1.0 ms      38%       3.561 V   +10.9%
;      3      2.1 ms      72%       4.082 V   +27.1%
;      4      1.7 ms      86%       4.279 V   +33.3%
;
;  run4 and run5 share the SAME 1 ms cadence but differ in N -> and differ
;  in error. So it is the CONVERSIONS, not the rate.
;
;  MECHANISM: code = Vin * FS / Vref_actual, but the firmware divides by an
;  ASSUMED ADC_VREF_V = 3.145 V. Under heavy conversion duty the reference
;  sags, codes read high, and the computed voltage inflates. It hits BOTH
;  channels identically — which is why R = V/I stayed pinned at ~21.4 ohm in
;  every run and very nearly hid the whole bug. R is immune (exact
;  common-mode cancellation, ISENSE_OFFSET_V = 0); V, I and especially
;  POWER (P = V*I, error SQUARED -> +78%) are not.
;
;  FIX: cut the conversion duty. At ~11.7 us per analogRead (measured:
;  readSma = 2*settle + 2*N*11.7 us, fits runs 0-5 to within 2%):
;
;      N=8  ->  readSma ~287 us,  duty ~19%
;      N=4  ->  readSma ~194 us,  duty ~ 9%   <- below the clean 14% point
;
;  PREDICTION (this is the falsifiable claim — check it):
;      rung 6 (N=8): V should come back to ~3.25-3.30 V  (small residual)
;      rung 7 (N=4): V should come back to ~3.21 V or BELOW
;
;  If rung 7 reads BELOW 3.21 V, that is itself a finding: it would mean even
;  the 14%-duty production config carries a small droop error, and ADC_VREF_V
;  needs re-calibrating at low duty.
;
;  WHY N=4 IS NOT THE PRECISION SACRIFICE IT LOOKS LIKE:
;      1 kHz x N=4  =  96 samples/fire x 4  = 384 conversions per fire
;      100 Hz x N=64 = 10 samples/fire x 64 = 640 conversions per fire
;  Comparable total averaging, but TEN TIMES the time resolution — and you
;  average the 96 samples in post, where it costs nothing.
; ══════════════════════════════════════════════════════════════════════

; Rung 6 — 1 kHz, N=8. Duty ~19%.
[env:portenta_m7_rate1k_n8]
extends     = m7_base
build_flags = ${m7_base.build_flags}
    -D ADC_SAMPLES_CYCLE=8
    -D SMA_SETTLE_US=50
    -D CYCLE_LOG_MS_CFG=1
    -D RATE_DECIM=10

; Rung 7 — 1 kHz, N=4. Duty ~9% — BELOW the clean 14% reference point.
; This is the candidate production config if the accuracy comes back.
[env:portenta_m7_rate1k_n4]
extends     = m7_base
build_flags = ${m7_base.build_flags}
    -D ADC_SAMPLES_CYCLE=4
    -D SMA_SETTLE_US=50
    -D CYCLE_LOG_MS_CFG=1
    -D RATE_DECIM=10
