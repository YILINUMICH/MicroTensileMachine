; PlatformIO Project Configuration — Firmware_ADS131M04Test_PIO
;
; Bench-test firmware for the ADS131M04 evaluation.
; Plan: ../docs/ADS131M04_migration_plan.md
;
; ── Why this runs on M7, not M4 ───────────────────────────────────────
; In production the ADC lives on M4. But M4 has no direct USB and no
; Ethernet — its output has to be bridged through M7 over Arduino RPC,
; which is exactly the machinery we do not want in the loop while
; deciding whether a driver works. On M7 this firmware talks straight
; out USB-CDC (and, later, straight out UDP).
;
; ── FLASH THE M4 IDLE IMAGE FIRST ─────────────────────────────────────
; Whatever M4 firmware is currently resident (SensorHub / CC fork) drives
; the SAME SPI1 bus and the SAME CS pin this test uses. Leave it running
; and the two cores fight over the bus; the symptom is intermittent CRC
; errors that look like a cable problem.
;
;   pio run -e portenta_m4_idle -t upload    ; park M4 in __WFI
;   pio run -e portenta_m7      -t upload    ; then the test firmware
;   pio device monitor                        ; 115200 baud
;
; ── POWER-CYCLE THE RIG AFTER EVERY UPLOAD ────────────────────────────
; Rig convention, inherited: the DFU reset does not cleanly re-power the
; EVM analog rails. Unplug USB + EVM supply, wait ~5 s, reapply.
;
; ── EVM JUMPERS — check before blaming the driver ─────────────────────
;   JP6/J13 [1-2]  : 8.192 MHz from Y1. CLKIN is MANDATORY — without it
;                    the chip answers register reads but NEVER converts.
;   JP5 NOT fitted : JP5 powers Y1 *down*. Fitting it kills the clock.
;   JP1-JP4 [3-4]  : factory default, both inputs grounded via 1 k.
;                    That IS the configuration T7 (shorted-input noise)
;                    wants — leave it until real sensors go on.
;
; ── COM-port pinning ──────────────────────────────────────────────────
; Zaber stage is on COM5, Portenta H7 on COM8; PIO would otherwise
; auto-pick the Zaber and wedge the stage. Override per-host on the CLI
; with --upload-port COMx (wins over this file).

[platformio]
default_envs = portenta_m7

[env]
upload_port  = COM8
monitor_port = COM8

; ── M7: the ADS131M04 bench-test application ──────────────────────────
[env:portenta_m7]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
    -D H7_TRANSPORT_UDP=1

; -- M7, USB-CDC only: the rollback / no-Ethernet build --------------------
; Same firmware with the sample stream on USB-CDC instead of UDP. Use it when
; the Ethernet link is unavailable; the host falls back automatically (it warns
; loudly and reverts to serial when `netcfg` is not a command the image knows).
;   pio run -e portenta_m7_usb -t upload
[env:portenta_m7_usb]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D H7_TRANSPORT_UDP=0

; ── M7 with per-frame driver tracing ──────────────────────────────────
; Prints a line per failed frame from inside the driver. Very noisy — use
; it to diagnose a WREG ack mismatch or a bad ID, not to take data.
;   pio run -e portenta_m7_trace -t upload
[env:portenta_m7_trace]
extends     = env:portenta_m7
build_flags =
    -Wall
    -Wextra
    -D ADS131M04_DEBUG=1

; ── M4 idle stub — FLASH THIS FIRST (see header) ──────────────────────
; Empty setup() + __WFI() loop, so M4 makes no SPI traffic at all.
;   pio run -e portenta_m4_idle -t upload
[env:portenta_m4_idle]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
    -D M4_IDLE
