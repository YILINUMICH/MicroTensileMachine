; PlatformIO Project Configuration — Portenta H7 M4 core  (LaserHead)
;
; Laser-only build of the ADS1263 sampler. ADC2 (24-bit, 400 SPS, Sinc3,
; gain=1) on AIN4(+) / AIN5(-), Keyence IL-030 analog out. External
; REF7050 (+5 V) on AIN0(+) / AIN1(-) shared with the unused ADC1.
;
; Sibling SensorHub_PIO is the production firmware that runs BOTH ADCs
; (load on ADC1/AIN2-3, laser on ADC2/AIN4-5). This project exists so
; laser-only experiments — IL-030 calibration via the Zaber stage in
; Calibrate_LaserHead/, sensor characterisation, etc. — can be done
; with a single-purpose firmware that doesn't drag the load-cell signal
; chain along.
;
; Ported to Mid Carrier (ASX00055) + bare TI ADS1263 EVM on 2026-05-26.
; lib/ADS1263/ was copied wholesale from SensorHub_PIO at port time to
; inherit both the Mid Carrier pin defines (PA_8/PC_6/PC_7) and the
; ADC2 driver bug fixes (RDATA2 6-byte frame, ADC2CFG REF2/GAIN2 field
; order). See LaserHead_PIO/src/main.cpp top-of-file note for details.
;
; The M4 has no direct USB, so Serial output is bridged through the M7
; via the Arduino RPC library. You therefore need TWO firmware images:
;
;   1. [env:portenta_m7_bridge]  → tiny M7 sketch that boots M4 +
;                                  forwards RPC ↔ USB Serial.
;                                  FLASH THIS FIRST (one time).
;   2. [env:portenta_m4]         → the laser-head sampler.
;                                  FLASH THIS SECOND.
;
; Both envs compile the same src/main.cpp; the #ifdef CORE_CMx guard
; picks the right code per core.
;
; Usage:
;   pio run                                   # builds default env (M4)
;   pio run -e portenta_m7_bridge -t upload   # flash M7 bridge once
;   pio run -e portenta_m4        -t upload   # flash M4 application
;   pio device monitor                        # 115200 baud — sees M4 output via M7
;
; Remember: power-cycle the rig (USB + EVM supply) after every upload
; — the dfu reset does not cleanly re-power the EVM's analog rails
; (the on-board TPS7A4700 LDO needs a full power-on transient to
; settle), and the ADS1263 will come up with ID=0x00 if you skip it.

[platformio]
default_envs = portenta_m4

; ── Port pin (shared by both envs) ────────────────────────────────────
; The rig has multiple serial devices on the host:
;   - COM5  Zaber X-LRM200A linear stage  (FTDI bridge, VID:PID=0403:6001)
;   - COM8  Portenta H7                   (Arduino CDC,  VID:PID=2341:025B)
; Without an explicit upload_port, PIO walks the COM list and may pick
; the Zaber, which then either fails to flash or — worse — wedges the
; stage controller. We pin both upload and monitor to COM8.
;
; Host-specific: COM8 is Yilin's current Windows machine. The VID:PIDs
; above are stable across hosts; if you replug into a different USB-A
; port and the H7 renumbers (or you take the rig to a different PC),
; check `pio device list` and update COM8 here. Or override on the CLI
; without editing this file (CLI wins over the .ini):
;   pio run -t upload --upload-port COMx
;   pio device monitor --port COMx
;
; The same port covers both envs because the M4 has no direct USB —
; M4 firmware is flashed through the M7's USB CDC.
[env]
upload_port  = COM8
monitor_port = COM8

[env:portenta_m4]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra

[env:portenta_m7_bridge]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
