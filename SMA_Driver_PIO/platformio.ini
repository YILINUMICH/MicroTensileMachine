; PlatformIO Project Configuration — SMA_Driver_PIO  (Portenta H7, M7 only)
;
; Standalone M7-only bring-up module for the Phase 6 SMA drive path:
;   M7  ── I2C ──►  MCP4728 DAC ── analog ──► TPS7A5701 LDO ── load ──► SMA
;        ── GPIO ─►  MOSFET (load enable)
;        ◄─ AIN ──  feedback divider on LDO output
;
; All MCP4728 + LDO power comes from an EXTERNAL bench supply
; (typically 5 V). The H7 only sources control signals. Logic-level
; shifting between the H7's 3.3 V I2C and the externally-powered
; MCP4728 must be handled in hardware (e.g. BSS138 + pullups to each
; rail). See README.md §Wiring.
;
; This is M7-only by design — no M4, no RPC, no shared SRAM ring.
; Bring-up runs in isolation against the bench supply with the SMA
; wire on a dummy load. Once accuracy + linearity are verified, the
; M7 code merges into SensorHub_PIO/ M7 so SMA control coexists with
; the dual-ADC sample stream.
;
; Flash workflow (M7-only — much simpler than the dual-core projects):
;   pio run -t upload
;   pio device monitor
;
; No M4 flash. The Portenta's existing M4 firmware (whatever was last
; loaded — likely SensorHub_PIO M4) is harmless here because this
; module's pin choices do not overlap with SensorHub_PIO M4's pins:
;   SensorHub_PIO M4 uses PA_8 (CS), PC_6 (DRDY), PC_7 (RESET).
;   SMA_Driver_PIO M7 uses Wire (PB6/PB7), A0, PG_7 (MOSFET = PWM3).
; The M4 will continue talking to the EVM in the background; M7 only
; runs this sketch.

[platformio]
default_envs = portenta_m7

[env]
; Same COM-port pinning rationale as SensorHub_PIO/platformio.ini:
; rig has Zaber on COM5 and Portenta H7 on COM8. Override on the CLI
; for different hosts (`--upload-port COMx`).
upload_port  = COM8
monitor_port = COM8

; ── Application: M7 SMA controller ────────────────────────────────────
[env:portenta_m7]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
lib_deps =
    adafruit/Adafruit MCP4728 @ ^1.0.10
    adafruit/Adafruit BusIO  @ ^1.14.0
build_flags =
    -Wall
    -Wextra

; ── M4 idle stub ──────────────────────────────────────────────────────
; Compiles src/main.cpp's CORE_CM4 branch — an empty setup() + __WFI()
; loop. Flashing this OVERWRITES the M4 partition (Bank 2) with a
; do-nothing image, which is the safe way to "remove" whatever M4
; firmware is left over from a previous SensorHub_PIO flash. After this
; runs, M4 boots, does nothing, sleeps. No SPI, no ring writes, no RPC.
;
; Use whenever you want to flash an M7-only sketch (SMA_Driver_PIO M7
; or any other test) without leftover M4 code touching the bus.
;
; Workflow:
;   1. pio run -e portenta_m4_idle -t upload     # wipe M4
;   2. power-cycle the rig
;   3. pio run -e portenta_m7      -t upload     # SMA M7 controller
;   4. power-cycle, pio device monitor
[env:portenta_m4_idle]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
