; PlatformIO Project Configuration — Calibrate_LaserHead_PIO
;
; Dedicated calibration firmware for the IL-030 → ADS1263 calibration
; workflow in ../. Both ADC1 and ADC2 sample AIN4/AIN5 simultaneously:
; ADC2 is the production-path measurement that becomes the calibration
; k/V₀; ADC1 is the independent digital-path cross-check. The host-side
; consumer is ../run_calibration.py with `xcompare: true` in config.yaml.
;
; Project tree:
;   src/main.cpp                — dual-ADC firmware (calibration-flavored)
;   lib/ADS1263/ADS1263_Driver.{h,cpp}
;                               — copied from ../../LaserHead_PIO/lib/ADS1263/
;                                 on 2026-05-26 (Mid Carrier pin defines +
;                                 Firmware_SensorHub_PIO-derived bug fixes for RDATA2
;                                 6-byte frame and ADC2CFG REF2/GAIN2 field
;                                 order). If new driver fixes land in any
;                                 sibling project, copy them here too.
;
; Why this is a separate PIO project (not a flag on LaserHead_PIO):
;   - LaserHead_PIO is the production laser-only firmware; its purpose is
;     to drive ADC2 alone. Cross-compare is a calibration concern, not a
;     production one, so it lives next to the calibration scripts.
;   - This keeps the firmware variants explicit at the project tree level
;     — flashing Calibrate_LaserHead_PIO is a deliberate, named act, not
;     a hidden build flag.
;
; Hardware target (post-port 2026-05-26):
;   - Portenta H7 on the Mid Carrier (ASX00055)
;   - Bare TI ADS1263 EVM
;   - External REF7050 (+5 V) on AIN0(+) / AIN1(-)            [Cable 2]
;   - Keyence IL-030 analog out  on AIN4(+) / AIN5(-)         [Cable 4]
;     (mirrors Firmware_SensorHub_PIO production wiring — calibration constants
;      apply to the production rig with no signal-chain translation)
;
; The M4 has no direct USB, so Serial output is bridged through the M7
; via the Arduino RPC library. You therefore need TWO firmware images:
;
;   1. [env:portenta_m7_bridge]  → tiny M7 sketch that boots M4 +
;                                  forwards RPC ↔ USB Serial.
;                                  FLASH THIS FIRST (one time).
;   2. [env:portenta_m4]         → the dual-ADC calibration sampler.
;                                  FLASH THIS SECOND.
;
; Both envs compile the same src/main.cpp; the #ifdef CORE_CMx guard
; picks the right code per core.
;
; Calibration workflow (host-side, in ../):
;   1. Flash this firmware (steps below).
;   2. python ../portenta_reader.py --port COM8 --duration 30
;      → verify interleaved src=1 / src=2 lines, both reading ~ same V.
;   3. python ../run_calibration.py --dry-run
;   4. python ../run_calibration.py
;   5. python ../analyze.py data/<prefix>_points.csv
;
; Usage:
;   pio run                                   # builds default env (M4)
;   pio run -e portenta_m7_bridge -t upload   # flash M7 bridge once
;   pio run -e portenta_m4        -t upload   # flash M4 application
;   pio device monitor                        # 115200 baud — sees M4 output via M7
;
; Remember: power-cycle the rig (USB + EVM supply) after every upload
; — the dfu reset does not cleanly re-power the EVM's analog rails
; (the on-board TPS7A4700 LDO needs a full power-on transient to
; settle), and the ADS1263 will come up with ID=0x00 if you skip it.

[platformio]
default_envs = portenta_m4

; ── Port pin (shared by both envs) ────────────────────────────────────
; The rig has multiple serial devices on the host:
;   - COM5  Zaber X-LSQ300A-E01 linear stage  (FTDI bridge, VID:PID=0403:6001)
;   - COM8  Portenta H7                   (Arduino CDC,  VID:PID=2341:025B)
; Without an explicit upload_port, PIO walks the COM list and may pick
; the Zaber, which then either fails to flash or — worse — wedges the
; stage controller. We pin both upload and monitor to COM8.
;
; Host-specific: COM8 is Yilin's current Windows machine. The VID:PIDs
; above are stable across hosts; if you replug into a different USB-A
; port and the H7 renumbers (or you take the rig to a different PC),
; check `pio device list` and update COM8 here. Or override on the CLI
; without editing this file (CLI wins over the .ini):
;   pio run -t upload --upload-port COMx
;   pio device monitor --port COMx
;
; The same port covers both envs because the M4 has no direct USB —
; M4 firmware is flashed through the M7's USB CDC.
[env]
upload_port  = COM13
monitor_port = COM13

[env:portenta_m4]
platform        = ststm32
board           = portenta_h7_m4
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra

[env:portenta_m7_bridge]
platform        = ststm32
board           = portenta_h7_m7
framework       = arduino
monitor_speed   = 115200
monitor_filters = default
build_flags =
    -Wall
    -Wextra
